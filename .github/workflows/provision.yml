name: Reintentar Aprovisionamiento OCI

on:
  schedule:
    # Se dispara automáticamente cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite lanzarlo a mano cuando quieras

jobs:
  apply-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configurar credenciales OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

          chmod 600 ~/.oci/config

      - name: Bucle de intentos de aprovisionamiento
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          # Intentar durante 25 rondas seguidas (aproximadamente 25 minutos de intentos activos)
          for ronda in {1..25}; do
            echo "============================================="
            echo "Iniciando intento #$ronda..."
            echo "============================================="

            JOB_ID=$(oci resource-manager job create-apply-job \
              --stack-id "${{ secrets.OCI_STACK_OCID }}" \
              --execution-plan-strategy "AUTO_APPROVED" \
              --query "data.id" \
              --raw-output)

            echo "Job creado: $JOB_ID"

            # Esperar resolución del job actual
            while true; do
              STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output)
              echo "Estado: $STATUS"

              if [ "$STATUS" = "SUCCEEDED" ]; then
                echo "¡Servidor aprovisionado con éxito!"
                exit 0
              elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "Intento fallido sin capacidad."
                break
              fi
              sleep 5
            done

            echo "Esperando 60 segundos antes del siguiente intento..."
            sleep 60
          done

          echo "Ronda de 25 minutos completada. El workflow finalizará y esperará al siguiente ciclo."
