name: Reintentar Aprovisionamiento OCI

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  apply-stack:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Instalar OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configurar credenciales OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

          chmod 600 ~/.oci/config

      - name: Bucle de intentos de aprovisionamiento
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
          GH_TOKEN: ${{ github.token }}
        run: |
          SERVER_CREATED=false

          for ronda in {1..12}; do
            echo "============================================="
            echo "Iniciando intento #$ronda..."
            echo "============================================="

            JOB_OUTPUT=$(oci resource-manager job create-apply-job \
              --stack-id "${{ secrets.OCI_STACK_OCID }}" \
              --execution-plan-strategy "AUTO_APPROVED" \
              --query "data.id" \
              --raw-output 2>&1) || true

            if echo "$JOB_OUTPUT" | grep -q "TooManyRequests"; then
              echo "Aviso: Límite de peticiones de Oracle alcanzado (429 TooManyRequests)."
              echo "Esperando 180 segundos de enfriamiento..."
              sleep 180
              continue
            fi

            if ! echo "$JOB_OUTPUT" | grep -q "ocid1.ormjob"; then
              echo "Error al crear job: $JOB_OUTPUT"
              echo "Esperando 150 segundos antes de reintentar..."
              sleep 150
              continue
            fi

            JOB_ID="$JOB_OUTPUT"
            echo "Job creado con éxito: $JOB_ID"
            echo "Esperando resolución del hipervisor..."

            while true; do
              STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null) || STATUS="UNKNOWN"
              echo "Estado: $STATUS"

              if [ "$STATUS" = "SUCCEEDED" ]; then
                echo "¡Servidor aprovisionado con éxito!"
                SERVER_CREATED=true
                break 2
              elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "Intento fallido sin capacidad."
                break
              fi
              sleep 10
            done

            echo "Esperando 150 segundos para el siguiente intento..."
            sleep 150
          done

          if [ "$SERVER_CREATED" = true ]; then
            echo "Servidor listo. No se encadenan más ejecuciones."
            exit 0
          fi

          echo "Fin de tanda. Disparando la siguiente ejecución inmediatamente..."
          gh workflow run provision.yml --ref main || true
